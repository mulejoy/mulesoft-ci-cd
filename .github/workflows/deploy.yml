name: Build and Deploy

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "Repository",
                "username": "${{ secrets.ANYPOINT_CLIENT_ID }}",
                "password": "${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Build
        run: mvn clean package --no-transfer-progress

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: DEV

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "Repository",
                "username": "${{ secrets.ANYPOINT_CLIENT_ID }}",
                "password": "${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy to CloudHub 2.0 (DEV)
        run: |
          mvn deploy -DmuleDeploy \
            -Ddeployment.env=DEV \
            -Ddeployment.target=Cloudhub-US-East-2 \
            --no-transfer-progress

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: PROD

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        with:
          repositories: |
            [
              {
                "id": "anypoint-exchange-v3",
                "url": "https://maven.anypoint.mulesoft.com/api/v3/maven"
              },
              {
                "id": "mulesoft-releases",
                "url": "https://repository.mulesoft.org/releases/"
              }
            ]
          servers: |
            [
              {
                "id": "Repository",
                "username": "${{ secrets.ANYPOINT_CLIENT_ID }}",
                "password": "${{ secrets.ANYPOINT_CLIENT_SECRET }}"
              }
            ]

      - name: Deploy to CloudHub 2.0 (PROD)
        run: |
          mvn deploy -DmuleDeploy \
            -Ddeployment.env=PROD \
            -Ddeployment.target=Cloudhub-US-East-2 \
            --no-transfer-progress
